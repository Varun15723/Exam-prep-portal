databases:
  - name: exam-prep-db
    plan: free
    databaseName: exam_prep
    user: exam_prep_user

services:
  - type: web
    name: exam-prep-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from app import create_app, db; app=create_app(); app.app_context().push(); db.create_all()" && gunicorn -w 2 -b 0.0.0.0:$PORT run:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: exam-prep-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.6
