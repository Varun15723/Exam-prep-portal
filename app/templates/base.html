<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Exam Prep Portal{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --bg: #0b0f1a;
            --card-bg: rgba(23, 31, 51, 0.6);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --error: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            background: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.15), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(192, 132, 252, 0.1), transparent 40%);
            display: flex;
            flex-direction: column;
        }

        .navbar {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(11, 15, 26, 0.8);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            font-size: 0.95rem;
        }

        .nav-link:hover {
            color: var(--text);
        }

        .nav-link.active {
            color: var(--primary);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.2);
            transform: translateY(-1px);
        }

        main {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }

        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid var(--border);
            border-bottom-color: var(--primary);
            border-radius: 50%;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        [data-protected] {
            display: none;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div id="loading-overlay" class="loader-overlay">
        <div class="loader"></div>
    </div>

    <nav class="navbar" id="main-nav" style="display: none;">
        <a href="/dashboard" class="logo">ExamPrep.</a>
        <div class="nav-links">
            <a href="/dashboard" class="nav-link" id="nav-dashboard">Dashboard</a>
            <a href="/subjects" class="nav-link" id="nav-subjects">Subjects</a>
            <a href="/planner" class="nav-link" id="nav-planner">Study Planner</a>
            <a href="/admin" class="nav-link" id="nav-admin" style="display: none;">Admin Panel</a>
            <button class="btn-logout" id="logout-btn">Logout</button>
        </div>
    </nav>

    <main id="main-content" style="display: none;">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/session.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
