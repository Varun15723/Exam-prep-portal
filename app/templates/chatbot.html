<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor Chat | Exam Prep Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --bg: #0b0f1a;
            --card-bg: rgba(23, 31, 51, 0.6);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --user-bubble: #6366f1;
            --ai-bubble: rgba(30, 41, 59, 0.8);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.15), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(192, 132, 252, 0.1), transparent 40%);
            overflow: hidden;
        }

        .navbar {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1000px;
            margin: 1.5rem auto;
            width: 95%;
            background: var(--card-bg);
            border-radius: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .chat-header {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .topic-selector-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        select {
            background: rgba(15, 23, 42, 0.8);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            outline: none;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        .chat-window {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            scroll-behavior: smooth;
        }

        /* Scrollbar styles */
        .chat-window::-webkit-scrollbar { width: 6px; }
        .chat-window::-webkit-scrollbar-track { background: transparent; }
        .chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .message {
            max-width: 80%;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { align-self: flex-end; }
        .message.ai { align-self: flex-start; }

        .bubble {
            padding: 0.8rem 1.2rem;
            border-radius: 1.25rem;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
        }

        .user .bubble {
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 0.25rem;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .ai .bubble {
            background: var(--ai-bubble);
            color: var(--text);
            border-bottom-left-radius: 0.25rem;
            border: 1px solid var(--border);
        }

        .timestamp {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
            margin-left: 0.5rem;
            margin-right: 0.5rem;
        }

        .user .timestamp { align-self: flex-end; }
        .ai .timestamp { align-self: flex-start; }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: var(--ai-bubble);
            padding: 0.8rem 1.2rem;
            border-radius: 1.25rem;
            border-bottom-left-radius: 0.25rem;
            margin-bottom: 1rem;
        }

        .dots { display: flex; gap: 4px; }
        .dot {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-area {
            padding: 1.2rem 1.5rem;
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            resize: none;
            outline: none;
            font-family: inherit;
            font-size: 0.95rem;
            max-height: 150px;
            transition: all 0.3s;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
            background: #4f46e5;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .send-btn:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 2rem;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h3 { color: var(--text); margin-bottom: 0.5rem; }

        @media (max-width: 640px) {
            .main-container { margin: 0; border-radius: 0; height: 100%; width: 100%; }
            .chat-header { flex-direction: column; gap: 1rem; align-items: stretch; }
            .message { max-width: 90%; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/dashboard" class="logo">ExamPrep.</a>
        <div class="actions">
            <a href="/dashboard" style="color: var(--text-muted); text-decoration: none; margin-right: 1.5rem;">Dashboard</a>
            <a href="/subjects" style="color: var(--text-muted); text-decoration: none; margin-right: 1.5rem;">Subjects</a>
        </div>
    </nav>

    <div class="main-container">
        <div class="chat-header">
            <div style="display: flex; align-items: center; gap: 0.8rem;">
                <i class="fas fa-robot" style="color: var(--primary); font-size: 1.4rem;"></i>
                <h2 style="margin: 0; font-size: 1.2rem; font-weight: 600;">AI Tutor</h2>
            </div>
            <div class="topic-selector-container">
                <span style="font-size: 0.9rem; color: var(--text-muted);">Topic:</span>
                <select id="topic-select">
                    <option value="">Select a topic...</option>
                </select>
            </div>
        </div>

        <div class="chat-window" id="chat-window">
            <div class="empty-state" id="empty-state">
                <i class="fas fa-comments"></i>
                <h3>Select a topic to start learning</h3>
                <p>Pick a topic from the dropdown to ask questions or view history.</p>
            </div>
        </div>

        <div class="typing-indicator" id="typing-indicator">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="chat-input" placeholder="Type your question here..." rows="1" disabled></textarea>
            </div>
            <button class="send-btn" id="send-btn" disabled>
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const topicSelect = document.getElementById('topic-select');
        const typingIndicator = document.getElementById('typing-indicator');
        const emptyState = document.getElementById('empty-state');

        let currentTopicId = null;
        const token = localStorage.getItem('access_token');

        // Check auth
        if (!token) {
            window.location.href = '/login';
        }

        // Initialize: Load topics
        async function loadTopics() {
            try {
                const response = await fetch('/api/subjects/', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const subjects = await response.json();

                for (const subject of subjects) {
                    const topicsResponse = await fetch(`/api/subjects/${subject.id}/topics`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const topics = await topicsResponse.json();

                    if (topics.length > 0) {
                        const group = document.createElement('optgroup');
                        group.label = subject.name;
                        
                        topics.forEach(topic => {
                            const option = document.createElement('option');
                            option.value = topic.id;
                            option.textContent = topic.name;
                            group.appendChild(option);
                        });
                        
                        topicSelect.appendChild(group);
                    }
                }
            } catch (error) {
                console.error('Error loading topics:', error);
            }
        }

        // Handle Topic Selection
        topicSelect.addEventListener('change', async (e) => {
            currentTopicId = e.target.value;
            if (currentTopicId) {
                chatInput.disabled = false;
                sendBtn.disabled = false;
                emptyState.style.display = 'none';
                await loadChatHistory(currentTopicId);
            } else {
                chatInput.disabled = true;
                sendBtn.disabled = true;
                emptyState.style.display = 'flex';
                chatWindow.innerHTML = '';
                chatWindow.appendChild(emptyState);
            }
        });

        // Load Chat History
        async function loadChatHistory(topicId) {
            chatWindow.innerHTML = '';
            try {
                const response = await fetch(`/api/chatbot/history?topic_id=${topicId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const history = await response.json();
                
                // History comes in desc order (newest first), let's reverse for display
                history.reverse().forEach(entry => {
                    addMessage(entry.question, 'user', entry.created_at);
                    addMessage(entry.answer, 'ai', entry.created_at);
                });
                
                scrollToBottom();
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        // Send Message
        async function sendMessage() {
            const question = chatInput.value.trim();
            if (!question || !currentTopicId) return;

            // Add user message to UI
            addMessage(question, 'user');
            chatInput.value = '';
            chatInput.style.height = 'auto';
            
            // Show typing indicator
            typingIndicator.style.display = 'block';
            scrollToBottom();

            try {
                const response = await fetch('/api/chatbot/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        topic_id: parseInt(currentTopicId),
                        question: question
                    })
                });

                const data = await response.json();
                typingIndicator.style.display = 'none';

                if (response.ok) {
                    addMessage(data.answer, 'ai');
                } else {
                    addMessage("Sorry, I encountered an error: " + (data.error || "Unknown error"), 'ai');
                }
            } catch (error) {
                typingIndicator.style.display = 'none';
                addMessage("Sorry, I couldn't connect to the server.", 'ai');
            }
            scrollToBottom();
        }

        function addMessage(text, sender, time = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            
            const timestamp = time ? new Date(time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            msgDiv.innerHTML = `
                <div class="bubble">${text}</div>
                <div class="timestamp">${timestamp}</div>
            `;
            
            chatWindow.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Event Listeners
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-grow textarea
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        loadTopics();
    </script>
</body>
</html>
